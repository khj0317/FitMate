name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (Testcontainers)
        run: ./gradlew test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (Railway와 같은 Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: fitmate
          POSTGRES_USER: fitmate
          POSTGRES_PASSWORD: fitmate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitmate -d fitmate" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start API (demo data on, mail to Mailpit)
        working-directory: backend
        env:
          DEMO_DATA_ENABLED: "true"
          RATE_LIMIT_ENABLED: "false"
        run: |
          ./gradlew bootJar -x test --console=plain
          nohup java -jar "$(ls build/libs/*.jar | grep -v plain)" > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && exit 0; sleep 2; done
          cat ../api.log; exit 1
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E
        env:
          BACKEND_URL: http://localhost:8081
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
