# 하루에 한 번만 헬스 체크를 불러서 DB를 깨운다. Supabase·Upstash 무료 플랜은 오래(약 7일) 쓰지 않으면
# 일시정지되기 때문이다. 서버(Render)는 평소에는 잠들어 있다가 접속이 오면 깨어난다.
# (예전에는 10분마다 깨워 두었지만, 무료 사용 시간을 다른 서비스와 나눠 쓰기 위해 줄였다)
name: Keep DB active

on:
  schedule:
    - cron: '0 18 * * *' # 매일 한국 시간 새벽 3시
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          # 잠들어 있었다면 깨어나는 데 1분 가까이 걸리므로 넉넉히 기다리고, 실패하면 두 번 더 시도한다
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors \
            https://fitmate-api-dwrd.onrender.com/actuator/health
