# Render Blueprint: Render 대시보드 → New → Blueprint → 이 저장소를 고르면 아래 설정으로 API 서버를 만든다.
# sync: false인 값(비밀번호·키)은 처음 만들 때 화면에서 직접 입력한다 (backend/.env.railway 값을 그대로 쓰면 됨)
services:
  - type: web
    name: fitmate-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    # 백엔드가 바뀐 커밋만 다시 배포한다 (웹만 바뀌면 Vercel만 배포)
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: fitmate
      - key: S3_PATH_STYLE
        value: "true"
      - key: STORAGE_TYPE
        value: s3
      - key: DEMO_DATA_ENABLED
        value: "false"
      # ---- 메일 (Render 무료 플랜은 SMTP 포트를 막아서 Brevo HTTP API로 보낸다) ----
      - key: BREVO_API_KEY
        sync: false
      # Brevo에서 인증한 발신자 주소. 예: FitMate <me@gmail.com>
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        value: "true"
      # 관리자 아이디 (쉼표로 여러 명)
      - key: ADMIN_LOGIN_IDS
        sync: false
      # Vercel 미들웨어와 같은 비밀값. 웹 요청은 Vercel을 거쳐 오므로, 비밀값이 맞을 때만 미들웨어가 보낸 사용자 IP를 믿는다
      - key: PROXY_SECRET
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      # ---- 무료 플랜(메모리 512MB)에 맞춘 설정. 512MB로 제한한 컨테이너에 부하를 걸어 검증한 값 ----
      # 힙은 40%만: Spring·Hibernate 등의 클래스 정보와 스레드가 힙 밖에서 약 250MB를 쓰기 때문
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:MaxRAMPercentage=40 -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=40m
          -XX:MaxDirectMemorySize=32m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1
          -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Seoul
      # glibc가 스레드마다 메모리 영역을 따로 잡아 RSS가 부푸는 것을 막는다
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "30"
      # 사진은 한 번에 1장씩 처리 (나머지는 잠시 대기, 20초 넘으면 "잠시 후 다시" 안내)
      - key: FITMATE_IMAGE_MAX_CONCURRENCY
        value: "1"
