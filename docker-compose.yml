services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: fitmate-postgres
    environment:
      POSTGRES_DB: fitmate
      POSTGRES_USER: fitmate
      POSTGRES_PASSWORD: fitmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmate -d fitmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fitmate-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
