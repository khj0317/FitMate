services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: fitmate-postgres
    restart: unless-stopped # Docker Desktop이 다시 켜지면 자동으로 함께 켜진다
    environment:
      POSTGRES_DB: fitmate
      POSTGRES_USER: fitmate
      POSTGRES_PASSWORD: fitmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmate -d fitmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fitmate-redis
    restart: unless-stopped # Docker Desktop이 다시 켜지면 자동으로 함께 켜진다
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 개발용 메일 서버: 앱이 보낸 메일을 http://localhost:8025 에서 확인 (실제로 발송되지 않음)
  mailpit:
    image: axllent/mailpit:latest
    container_name: fitmate-mailpit
    restart: unless-stopped # Docker Desktop이 다시 켜지면 자동으로 함께 켜진다
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
