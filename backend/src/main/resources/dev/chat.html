<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitMate 채팅 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --text: #1d2229; --muted: #6b7480; --accent: #2f6fed; --mine: #2f6fed; --theirs: #eef0f3; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    header strong { margin-right: 8px; }
    input, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    button.secondary { background: #fff; color: var(--text); border-color: var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: var(--muted); font-size: 13px; margin-left: auto; }
    main { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 58px); }
    #rooms { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
    .room { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .room.active { background: #eaf1ff; }
    .room .name { font-weight: 600; display: flex; justify-content: space-between; }
    .room .preview { color: var(--muted); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { background: #e5484d; color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }
    #chat { display: flex; flex-direction: column; min-width: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: var(--theirs); overflow-wrap: anywhere; }
    .msg.mine { align-self: flex-end; background: var(--mine); color: #fff; }
    .msg .meta { font-size: 11px; opacity: .7; margin-bottom: 2px; }
    #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
    #composer input { flex: 1; }
    .empty { color: var(--muted); padding: 16px; }
    #older { align-self: center; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; grid-template-rows: 160px 1fr; } #rooms { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
<header>
  <strong>FitMate 채팅 테스트</strong>
  <input id="email" placeholder="이메일" value="demo01@fitmate.com" autocomplete="username">
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="login">로그인</button>
  <button id="refresh" class="secondary" disabled>방 목록 새로고침</button>
  <span id="status">로그인하세요</span>
</header>
<main>
  <aside id="rooms"><div class="empty">로그인하면 채팅방이 표시됩니다.</div></aside>
  <section id="chat">
    <div id="messages"><div class="empty">채팅방을 선택하세요.</div></div>
    <form id="composer">
      <input id="text" placeholder="메시지 입력" maxlength="1000" disabled autocomplete="off">
      <button id="send" disabled>보내기</button>
    </form>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const state = { token: null, myId: null, client: null, roomId: null, subscription: null, nextCursor: null };

  function setStatus(text) { $('status').textContent = text; }

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(state.token && { Authorization: 'Bearer ' + state.token }) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.message || res.status);
    }
    return res.status === 204 ? null : res.json();
  }

  $('login').onclick = async () => {
    try {
      const token = await api('POST', '/api/auth/login', { email: $('email').value, password: $('password').value });
      state.token = token.accessToken;
      state.myId = (await api('GET', '/api/users/me')).id;
      connectSocket();
      $('refresh').disabled = false;
      await loadRooms();
    } catch (e) {
      setStatus('로그인 실패: ' + e.message);
    }
  };
  $('refresh').onclick = () => loadRooms();

  function connectSocket() {
    if (state.client) state.client.deactivate();
    const url = location.origin.replace(/^http/, 'ws') + '/ws';
    state.client = new StompJs.Client({
      brokerURL: url,
      connectHeaders: { Authorization: 'Bearer ' + state.token },
      reconnectDelay: 3000,
      onConnect: () => {
        setStatus('WebSocket 연결됨 (사용자 ID ' + state.myId + ')');
        state.client.subscribe('/user/queue/errors', (frame) => alert('오류: ' + JSON.parse(frame.body).message));
        if (state.roomId) subscribeRoom(state.roomId);
      },
      onWebSocketClose: () => setStatus('WebSocket 연결 끊김, 재연결 중...'),
      onStompError: (frame) => setStatus('STOMP 오류: ' + frame.headers.message),
    });
    state.client.activate();
  }

  async function loadRooms() {
    const rooms = await api('GET', '/api/chat-rooms');
    const list = $('rooms');
    list.replaceChildren();
    if (rooms.length === 0) {
      list.innerHTML = '<div class="empty">채팅방이 없습니다. 매칭 요청을 수락하면 생깁니다.</div>';
      return;
    }
    for (const room of rooms) {
      const item = document.createElement('div');
      item.className = 'room' + (room.roomId === state.roomId ? ' active' : '');
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = room.counterpart ? room.counterpart.nickname : '채팅방 ' + room.roomId;
      if (room.unreadCount > 0) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = room.unreadCount;
        name.append(badge);
      }
      const preview = document.createElement('div');
      preview.className = 'preview';
      preview.textContent = room.lastMessage ? room.lastMessage.content : '아직 메시지가 없습니다';
      item.append(name, preview);
      item.onclick = () => openRoom(room.roomId);
      list.append(item);
    }
  }

  async function openRoom(roomId) {
    state.roomId = roomId;
    $('messages').replaceChildren();
    const page = await api('GET', `/api/chat-rooms/${roomId}/messages?size=30`);
    state.nextCursor = page.nextCursor;
    renderOlderButton();
    page.messages.slice().reverse().forEach((m) => appendMessage(m));
    subscribeRoom(roomId);
    $('text').disabled = false;
    $('send').disabled = false;
    $('text').focus();
    await markRead(page.messages[0]);
    await loadRooms();
  }

  function subscribeRoom(roomId) {
    if (state.subscription) state.subscription.unsubscribe();
    if (!state.client || !state.client.connected) return;
    state.subscription = state.client.subscribe(`/topic/chat-rooms/${roomId}`, async (frame) => {
      const message = JSON.parse(frame.body);
      appendMessage(message);
      await markRead(message);
      await loadRooms();
    });
  }

  function renderOlderButton() {
    const existing = $('older');
    if (existing) existing.remove();
    if (!state.nextCursor) return;
    const button = document.createElement('button');
    button.id = 'older';
    button.className = 'secondary';
    button.textContent = '이전 메시지 더 보기';
    button.onclick = loadOlder;
    $('messages').prepend(button);
  }

  async function loadOlder() {
    const page = await api('GET', `/api/chat-rooms/${state.roomId}/messages?size=30&cursor=${state.nextCursor}`);
    state.nextCursor = page.nextCursor;
    const box = $('messages');
    const anchor = $('older').nextSibling;
    page.messages.forEach((m) => box.insertBefore(messageElement(m), anchor));
    renderOlderButton();
  }

  async function markRead(message) {
    if (message) await api('POST', `/api/chat-rooms/${state.roomId}/read`, { lastMessageId: message.id });
  }

  function messageElement(message) {
    const el = document.createElement('div');
    el.className = 'msg' + (message.senderId === state.myId ? ' mine' : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (message.senderNickname || '알 수 없음') + ' · ' + new Date(message.createdAt).toLocaleTimeString('ko-KR');
    const body = document.createElement('div');
    body.textContent = message.content; // textContent로 넣어 XSS 방지
    el.append(meta, body);
    return el;
  }

  function appendMessage(message) {
    const box = $('messages');
    box.append(messageElement(message));
    box.scrollTop = box.scrollHeight;
  }

  $('composer').onsubmit = (event) => {
    event.preventDefault();
    const content = $('text').value.trim();
    if (!content || !state.client || !state.client.connected) return;
    state.client.publish({
      destination: `/app/chat-rooms/${state.roomId}/messages`,
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    $('text').value = '';
  };
</script>
</body>
</html>
