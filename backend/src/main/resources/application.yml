spring:
  application:
    name: fitmate-backend

  # 로컬은 docker-compose 기본값, 배포 시 환경 변수로 Supabase 연결 (Session 모드, 포트 5432)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitmate}
    username: ${DB_USERNAME:fitmate}
    password: ${DB_PASSWORD:fitmate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 사진 업로드: 브라우저에서 줄여서 보내지만, 원본을 보내는 경우를 대비해 10MB까지 허용
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # 로컬은 docker-compose의 Mailpit(SMTP 1025), 배포 시 실제 SMTP (예: Gmail 앱 비밀번호, Resend, SES)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # 로컬은 redis://, Upstash는 rediss:// (TLS)
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8081}
  # 프록시 뒤에서 실제 클라이언트 IP를 쓴다 (로그인 제한용). native는 내부망 프록시가 붙인
  # X-Forwarded-For만 믿어서, 클라이언트가 헤더를 위조해 IP 제한을 피하는 것을 막는다
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # 메일 서버가 잠깐 안 돼도 서버 자체는 정상으로 본다 (메일은 비동기 부가 기능)
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fitmate:
  # 개발용 데모 사용자·모임·게시글 생성 (로컬은 application-local.yml에서 켬, 배포에서는 끔)
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  # 웹 리프레시 토큰 쿠키. https가 아닌 로컬 개발에서는 application-local.yml에서 false
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # Vercel 미들웨어와 나눠 가진 비밀값. 맞을 때만 미들웨어가 보낸 사용자 IP를 믿는다. 비우면 요청 주소 그대로
  proxy-secret: ${PROXY_SECRET:}
  # CDN이 넣는 사용자 IP 헤더. 비우면 Render에서만 cf-connecting-ip (앞단 Cloudflare가 넣고, 위조한 값은 덮어씀)
  edge-ip-header: ${EDGE_IP_HEADER:}
  # 관리자로 지정할 아이디 (쉼표로 여러 명). 서버가 뜰 때 이 사용자들의 권한을 ADMIN으로 맞춘다
  admin:
    login-ids: ${ADMIN_LOGIN_IDS:}
  # 가입·이메일 변경 시 이메일 인증 코드 확인
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
  # 메일 발송: Brevo API 키가 있으면 HTTPS API로 (Render 무료 플랜은 SMTP 포트를 막음), 없으면 아래 SMTP 설정으로
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
  # 글·댓글·요청 도배 방지 (RateLimitInterceptor)
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}

# 배포 시 JWT_SECRET을 32자 이상의 랜덤 문자열로 반드시 교체
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  issuer: fitmate
  access-token-ttl: 30m
  refresh-token-ttl: 14d

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 지역 검색: 카카오 REST API 키가 있으면 카카오 로컬 API, 없으면 내장 지역 목록을 사용
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

app:
  mail:
    from: ${MAIL_FROM:FitMate <no-reply@fitmate.local>}

# 사진 저장소: local(개발, backend/uploads 폴더) 또는 s3(배포, Supabase Storage·AWS S3 등 S3 호환)
storage:
  type: ${STORAGE_TYPE:local}
  local:
    dir: ${STORAGE_LOCAL_DIR:./uploads}
    # 사진 URL 앞에 붙일 백엔드 주소. 비우면 /files/... 상대 경로 (개발 중에는 웹 프록시가 처리)
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    public-url: ${S3_PUBLIC_URL:}
    path-style: ${S3_PATH_STYLE:true}
