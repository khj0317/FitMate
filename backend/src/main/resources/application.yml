spring:
  application:
    name: fitmate-backend

  # 로컬은 docker-compose 기본값, 배포 시 환경 변수로 Supabase 연결 (Session 모드, 포트 5432)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitmate}
    username: ${DB_USERNAME:fitmate}
    password: ${DB_PASSWORD:fitmate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 로컬은 redis://, Upstash는 rediss:// (TLS)
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
